name: Fetch reachability probes

# Reachability probes for tools that have NO public status page:
# MaxPreps, Neptune GameTime, ATGenius, Swank Digital Campus, Project STEM,
# and Flint (the K-12 AI platform:
# status.flintk12.com just 302-redirects to an app sign-in, so there is no
# public status JSON to read). Each is a server-side HTTP check
# (classified by response, not by scraping a banner), written to its own JSON
# in the RJ Website / Arbiter "synthetic check" schema:
#   severity ('operational' | 'degraded' | 'major') + statusLabel/statusDetail,
#   with parseError when OUR probe target moved (a stale-URL 4xx).
#
# All of them are simple single-URL GETs, so they share one workflow: probed
# sequentially and committed in a single push (no cross-workflow push races,
# less Actions noise). Limitation, same as the rest of the dashboard: this
# runs from GitHub's runners, so it catches vendor-side outages, not an
# RJ-network or Securly issue.

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs during high load,
    # so actual cadence can be 5-15 minutes — fine for our purposes.
    # The minute offset only spreads the nine scrapers out so they collide
    # less often; the commit-snapshot action is what actually makes the
    # pushes safe when they do collide.
    - cron: '4-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let a delayed run overlap the next scheduled one.
concurrency:
  group: fetch-athletics-probes
  cancel-in-progress: false

jobs:
  fetch-athletics-probes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe athletics tools
        run: |
          node <<'EOF'
          const https = require('https');
          const fs = require('fs');

          const TARGETS = [
            { name: 'MaxPreps',         url: 'https://www.maxpreps.com/', out: 'maxpreps.json' },
            { name: 'Neptune GameTime', url: 'https://neptunenow.com/',   out: 'neptune.json'  },
            { name: 'ATGenius',         url: 'https://atgenius.com/',     out: 'atgenius.json' },
            { name: 'Flint',            url: 'https://app.flintk12.com/', out: 'flint.json', forbiddenIsUp: true },
            // Swank Digital Campus — licensed film streaming. No status page of
            // any kind (incidents are Zendesk help-centre articles), so this is the
            // only signal we can get. Probes RJ's OWN tenant login URL, not the
            // swankmp.net root, so an account-specific breakage shows up too.
            // Correct student/teacher path is /rjhs406365/login; /admin/... is the
            // staff console. forbiddenIsUp because Swank's edge serves a
            // blanket-deny robots.txt and may 401/403 datacenter IPs.
            { name: 'Swank',            url: 'https://digitalcampus.swankmp.net/rjhs406365/login?returnUrl=%2FRJHS406365', out: 'swank.json', forbiddenIsUp: true },
            // Project STEM (formerly Edhesive) — the course platform AP CSP and
            // AP CSA run on. No status page of any kind: no Atlassian Statuspage,
            // no StatusGator service, no help-centre incident feed. Support is an
            // email address and a JotForm. So, as with Swank, reachability of the
            // sign-in gate is the only real-time signal there is.
            //
            // Probe target is the sign-in page teachers and students actually
            // land on, not the marketing root, so a broken auth gate surfaces
            // even while the brochure site is fine. forbiddenIsUp because the
            // platform is robots-restricted (courses.projectstem.org refuses
            // crawlers outright) and may answer datacenter IPs with 401/403.
            { name: 'Project STEM',     url: 'https://projectstem.org/users/sign_in', out: 'projectstem.json', forbiddenIsUp: true },
          ];

          const ATTEMPTS      = 3;      // best-of, to dampen single-request runner blips
          const TIMEOUT_MS    = 10000;  // per attempt
          const MAX_REDIRECTS = 5;
          // Heartbeat: the dashboard flags a tile whose fetchedAt is older than
          // ~90 minutes, so a probe that has silently died is visible on the page
          // instead of only in the Actions tab. That only works if a healthy probe
          // refreshes its timestamps periodically — hence we write once an hour
          // even when nothing material changed. Do not "optimise" this away.
          const HEARTBEAT_MS  = 60 * 60 * 1000;
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' +
                     '(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36';

          // One HTTP probe. Resolves { status } on any HTTP response (following
          // redirects), rejects on network error / timeout. We only need the
          // status line, so we tear down the socket immediately.
          function probeOnce(url, redirectsLeft) {
            return new Promise((resolve, reject) => {
              const req = https.get(
                url,
                { headers: { 'User-Agent': UA, 'Accept': 'text/html' } },
                (res) => {
                  const status = res.statusCode;
                  if (status >= 300 && status < 400 && res.headers.location && redirectsLeft > 0) {
                    res.destroy();
                    let next;
                    try { next = new URL(res.headers.location, url).toString(); }
                    catch (e) { resolve({ status }); return; }
                    resolve(probeOnce(next, redirectsLeft - 1));
                    return;
                  }
                  res.destroy();
                  resolve({ status });
                }
              );
              req.setTimeout(TIMEOUT_MS, () => {
                req.destroy(new Error('timeout after ' + TIMEOUT_MS + 'ms'));
              });
              req.on('error', reject);
            });
          }

          // Classify one attempt into a dashboard-facing outcome.
          //   { kind: 'status', severity, label, detail } — a real reading
          //   { kind: 'probeError', detail }              — reachable but not a
          //                                                 liveness answer (stale-URL 4xx)
          function classifyAttempt(result) {
            const s = result.status;
            if (s >= 200 && s < 400) return { kind: 'status', severity: 'operational', label: 'Reachable',   detail: 'HTTP ' + s };
            if (s === 429)           return { kind: 'status', severity: 'degraded',    label: 'Throttled',   detail: 'HTTP 429' };
            if (s >= 500)            return { kind: 'status', severity: 'major',       label: 'Unreachable', detail: 'HTTP ' + s };
            return { kind: 'probeError', detail: 'HTTP ' + s };
          }

          // Best-of ranking (lower = preferred). ANY HTTP response proves the
          // origin is reachable, so a reachable-but-wrong-URL result outranks
          // "unreachable" (major).
          function outcomeRank(o) {
            if (o.kind === 'probeError') return 2;
            switch (o.severity) {
              case 'operational': return 0;
              case 'degraded':    return 1;
              case 'major':       return 3;
              default:            return 3;
            }
          }

          function readExisting(path) {
            if (!fs.existsSync(path)) return null;
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (_) { return null; }
          }

          // Only material fields decide whether we write — timestamps are
          // bookkeeping, so we don't commit every 5 minutes when nothing changed.
          function contentEqual(a, b) {
            if (!a || !b) return false;
            const fields = ['severity', 'statusLabel', 'statusDetail', 'parseError'];
            return fields.every(f => JSON.stringify(a[f]) === JSON.stringify(b[f]));
          }

          async function probeTarget(t) {
            const existing = readExisting(t.out);
            const outcomes = [];
            for (let i = 0; i < ATTEMPTS; i++) {
              try { outcomes.push(classifyAttempt(await probeOnce(t.url, MAX_REDIRECTS))); }
              catch (e) {
                outcomes.push({ kind: 'status', severity: 'major', label: 'Unreachable',
                                detail: (e && e.message) || 'network error' });
              }
            }
            outcomes.sort((a, b) => outcomeRank(a) - outcomeRank(b));
            let best = outcomes[0];
            // Flint and Swank (forbiddenIsUp) sit behind bot protection that
            // can answer datacenter requests with 401/403 even when fully up.
            // That is the EDGE responding — proof of reachability, not a moved URL
            // — so treat it as operational. A real outage still surfaces as a 5xx
            // or a timeout (major), and a 404/410 still means the URL moved.
            if (t.forbiddenIsUp && best.kind === 'probeError' && /HTTP (401|403)/.test(best.detail)) {
              best = { kind: 'status', severity: 'operational', label: 'Reachable',
                       detail: best.detail + ' (auth-gated edge)' };
            }
            const now = new Date().toISOString();

            let newContent;
            if (best.kind === 'probeError') {
              const lastGood = existing || {};
              newContent = {
                severity: lastGood.severity || 'unknown',
                statusLabel: lastGood.statusLabel || 'Unknown',
                statusDetail: best.detail,
                parseError: {
                  message: t.name + ' probe returned ' + best.detail + ' — ' + t.url +
                           ' may have moved. Update the target in fetch-athletics-probes.yml.',
                  firstFailedAt: (lastGood.parseError && lastGood.parseError.firstFailedAt) || now
                },
                lastSuccessfulParse: lastGood.lastSuccessfulParse || null
              };
            } else {
              const unchanged = existing && !existing.parseError &&
                                existing.severity === best.severity &&
                                existing.statusDetail === best.detail;
              newContent = {
                severity: best.severity,
                statusLabel: best.label,
                statusDetail: best.detail,
                parseError: null,
                lastSuccessfulParse: unchanged ? existing.lastSuccessfulParse : now
              };
            }

            if (contentEqual(newContent, existing)) {
              // Nothing material changed, so normally we skip. Still write once an
              // hour (or if the stored timestamp is unreadable) to keep fetchedAt
              // honest for the dashboard's staleness check.
              const last = Date.parse(existing.fetchedAt || '');
              if (Number.isFinite(last) && (Date.now() - last) < HEARTBEAT_MS) {
                console.log(t.name + ': no material change (' + newContent.severity +
                            (newContent.parseError ? ', probe error' : '') + ')');
                return;
              }
              console.log(t.name + ': hourly heartbeat — refreshing timestamps');
            }
            const snapshot = { fetchedAt: now, ...newContent };
            fs.writeFileSync(t.out, JSON.stringify(snapshot, null, 2) + '\n');
            console.log(t.name + ': wrote ' + t.out);
            console.log(JSON.stringify(snapshot));
          }

          (async () => {
            for (const t of TARGETS) {
              try { await probeTarget(t); }
              catch (e) { console.error(t.name + ': unexpected error ' + (e && e.message)); }
            }
          })();
          EOF

      # Race-safe commit + the health gate. Red only when OUR probe needs fixing
      # (a stale-URL 4xx = parseError). A real vendor outage is a normal detected
      # state (severity "major") and deliberately does NOT fail the run.
      - name: Commit and report
        uses: ./.github/actions/commit-snapshot
        with:
          files: maxpreps.json neptune.json atgenius.json flint.json swank.json projectstem.json
          message: Update athletics probe snapshots

name: Fetch Gimkit status

# Gimkit's status page is hosted on Crisp Status, which exposes no public read
# API, so the rendered banner is scraped.
#
# The parsing logic is NOT in this file. It lives in
# .github/scripts/vendors/gimkit.js, which is a plain Node module, so it can be
# read, linted and unit-tested (`node --test .github/scripts/test/`) instead of
# living in a YAML heredoc where five copies of the same helper code drifted
# apart. The shared fetch/retry/grace-period machinery is in
# .github/scripts/snapshot-lib.js.
#
# Failure handling, in short: a timeout or 5xx is retried 3x within the run and
# then tolerated for 3 consecutive runs before the tile is allowed to go grey,
# because a single flaky fetch is not a broken scraper. A page we do not
# recognise is reported immediately, because that never fixes itself.

on:
  schedule:
    # Every 15 minutes, offset to stagger against the other scrapers. GitHub may
    # delay scheduled runs during high load, so actual cadence can be 5-15
    # minutes — fine for our purposes. The offset only reduces collisions; the
    # commit-snapshot action is what actually makes concurrent pushes safe.
    - cron: '6-59/15 * * * *'
  workflow_dispatch:  # Allow manual runs from the Actions tab

permissions:
  contents: write  # Needed to commit the updated JSON file

# Never let two runs of this workflow overlap — a delayed run colliding with the
# next scheduled one would race against itself on the push.
concurrency:
  group: fetch-gimkit
  cancel-in-progress: false

jobs:
  fetch-gimkit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and parse Gimkit Crisp Status page
        run: node .github/scripts/fetch-snapshot.js gimkit

      - name: Commit and report
        uses: ./.github/actions/commit-snapshot
        with:
          files: gimkit.json
          message: Update Gimkit status snapshot

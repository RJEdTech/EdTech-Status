name: Alert on status changes

# Runs every 10 minutes. Compares each monitored vendor's current status against
# the last-known state in state/last-status.json. When a vendor changes state
# (operational <-> degraded/partial/major, or breakage), posts a single
# consolidated message to a Teams channel via incoming webhook.
#
# Vendor list mirrors index.html's VENDORS array. Direct API fetches for vendors
# with public JSON (statuspage, instatus). For vendors served by snapshot files
# maintained by the other workflows in this repo, we read those JSON files
# straight off the checkout. Microsoft 365 is link-only and skipped.
#
# First run after deployment writes state and sends no alerts (no baseline to
# compare against). Subsequent runs only post when something actually changed.
#
# PUSH RACE: the scraper workflows commit to main every 5 minutes, so a plain
# `git push` here loses the race regularly ("failed to push some refs / fetch
# first"). The commit step retries with a fetch-and-reapply loop plus randomized
# jitter. Our state file is freshly computed each run, so last-write-wins is the
# correct merge semantic — we never need to reconcile with the remote copy.

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs during high load,
    # so actual cadence can be 10-20 minutes — fine for this purpose.
    - cron: '*/10 * * * *'
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: write  # needed to commit updated state file

# Never let two alerter runs overlap — concurrent runs would both diff against
# the same baseline and double-post the same change.
concurrency:
  group: alert-on-status-changes
  cancel-in-progress: false

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check vendor statuses and alert on changes
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const https = require('https');

          // ---------- Vendor configuration ----------
          // Mirrors index.html's VENDORS array (31 tiles; m365 is link-only and
          // has no machine-readable signal, so it is deliberately absent here).
          // `tier` controls alert priority and infra-suppression.
          // `shape` tells the snapshot reader which field carries the state —
          // the scrapers are not uniform:
          //   'severity'  → data.severity (aws, gimkit, arbitersports, probes…)
          //   'status'    → data.status, 'operational' or not (explorelearning, soundtrap)
          //   'noredink'  → data.severity with maintenance/check_page remapped
          const VENDORS = [
            // ---- CRITICAL ----
            { id: 'instructure', name: 'Canvas', tier: 'critical', kind: 'statuspage',
              url: 'https://status.instructure.com/api/v2/status.json',
              pageUrl: 'https://status.instructure.com/' },
            { id: 'blackbaud', name: 'Blackbaud', tier: 'critical', kind: 'statuspage',
              url: 'https://status.blackbaud.com/api/v2/status.json',
              pageUrl: 'https://status.blackbaud.com/' },

            // ---- CORE ----
            { id: 'myrj', name: 'MyRJ', tier: 'core', kind: 'snapshot', shape: 'severity',
              file: 'myrj.json',
              pageUrl: 'https://regisjesuit.myschoolapp.com/app/faculty?svcid=edu' },
            { id: 'vivi', name: 'Vivi', tier: 'core', kind: 'statuspage',
              url: 'https://status.vivi.io/api/v2/status.json',
              pageUrl: 'https://status.vivi.io/' },
            // Flint has no public status page — status.flintk12.com 302-redirects to
            // an app sign-in. index.html was moved to the server-side reachability
            // probe (fetch-athletics-probes.yml -> flint.json) back in August; this
            // alerter was left pointing at the dead Statuspage URL, so it reported
            // Flint as permanently 'breakage' while the dashboard showed it green.
            { id: 'flint', name: 'Flint', tier: 'core', kind: 'snapshot', shape: 'severity',
              file: 'flint.json',
              pageUrl: 'https://app.flintk12.com/' },
            { id: 'respondus', name: 'LockDown Browser', tier: 'core', kind: 'statuspage',
              url: 'https://status.respondus.com/api/v2/status.json',
              pageUrl: 'https://status.respondus.com/' },
            { id: 'ruvna', name: 'Ruvna', tier: 'core', kind: 'statuspage',
              url: 'https://status.ruvna.com/api/v2/status.json',
              pageUrl: 'https://status.ruvna.com/' },
            { id: 'rj-website', name: 'RJ Website', tier: 'core', kind: 'snapshot', shape: 'severity',
              file: 'rj-website.json',
              pageUrl: 'https://www.regisjesuit.com/' },

            // ---- SECONDARY ----
            { id: 'copyleaks', name: 'Copyleaks', tier: 'secondary', kind: 'instatus',
              url: 'https://status.copyleaks.com/summary.json',
              pageUrl: 'https://status.copyleaks.com/' },
            { id: 'aspiredu', name: 'Grade Guardian', tier: 'secondary', kind: 'statuspage',
              url: 'https://aspiredu.statuspage.io/api/v2/status.json',
              pageUrl: 'https://aspiredu.statuspage.io/' },
            { id: 'deltamath', name: 'DeltaMath', tier: 'secondary', kind: 'statuspage',
              url: 'https://status.deltamath.com/api/v2/status.json',
              pageUrl: 'https://status.deltamath.com/' },
            { id: 'finalsite', name: 'Finalsite', tier: 'secondary', kind: 'statuspage',
              url: 'https://status.finalsite.com/api/v2/status.json',
              pageUrl: 'https://status.finalsite.com/' },
            { id: 'hudl', name: 'Hudl', tier: 'secondary', kind: 'statuspage',
              url: 'https://status.hudl.com/api/v2/status.json',
              pageUrl: 'https://status.hudl.com/' },
            { id: 'explorelearning', name: 'Gizmos', tier: 'secondary', kind: 'snapshot', shape: 'status',
              file: 'explorelearning.json',
              pageUrl: 'https://www.explorelearning.com/our-products/site-status' },
            { id: 'gimkit', name: 'Gimkit', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'gimkit.json',
              pageUrl: 'https://gimkit.crisp.watch/en/' },
            { id: 'soundtrap', name: 'Soundtrap', tier: 'secondary', kind: 'snapshot', shape: 'status',
              file: 'soundtrap.json',
              pageUrl: 'https://status.soundtrap.com/' },
            { id: 'canva', name: 'Canva', tier: 'secondary', kind: 'statuspage',
              url: 'https://www.canvastatus.com/api/v2/status.json',
              pageUrl: 'https://www.canvastatus.com/' },
            { id: 'noredink', name: 'NoRedInk', tier: 'secondary', kind: 'snapshot', shape: 'noredink',
              file: 'noredink.json',
              pageUrl: 'https://noredinkstatus.com/' },
            { id: 'vhlcentral', name: 'VHL Central', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'vhlcentral.json',
              pageUrl: 'https://www.vhlcentral.com/' },
            { id: 'kwlhub', name: 'The KWL Hub', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'kwlhub.json',
              pageUrl: 'https://thekwlhub.com/' },
            { id: 'autodesk', name: 'Autodesk', tier: 'secondary', kind: 'statuspage',
              url: 'https://health.autodesk.com/api/v2/status.json',
              pageUrl: 'https://health.autodesk.com/' },
            { id: 'onshape', name: 'Onshape', tier: 'secondary', kind: 'statuspage',
              url: 'https://status.onshape.com/api/v2/status.json',
              pageUrl: 'https://status.onshape.com/' },
            { id: 'arbitersports', name: 'ArbiterSports', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'arbitersports.json',
              pageUrl: 'https://www1.arbitersports.com/ArbiterGame/Schedule' },
            { id: 'maxpreps', name: 'MaxPreps', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'maxpreps.json',
              pageUrl: 'https://www.maxpreps.com/' },
            { id: 'neptune', name: 'Neptune GameTime', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'neptune.json',
              pageUrl: 'https://neptunenow.com/' },
            { id: 'atgenius', name: 'ATGenius', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'atgenius.json',
              pageUrl: 'https://atgenius.com/' },

            // Swank Digital Campus — licensed film streaming. Reachability probe
            // only; Swank publishes no status feed (incidents are Zendesk articles).
            // Same snapshot/severity shape as the other probes.
            { id: 'swank', name: 'Swank Digital Campus', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'swank.json',
              pageUrl: 'https://digitalcampus.swankmp.net/rjhs406365/login?returnUrl=%2FRJHS406365' },

            // Project STEM (formerly Edhesive) — the AP CS course platform.
            // Reachability probe only; Project STEM publishes no status feed of
            // any kind. Same snapshot/severity shape as the other probes.
            { id: 'projectstem', name: 'Project STEM', tier: 'secondary', kind: 'snapshot', shape: 'severity',
              file: 'projectstem.json',
              pageUrl: 'https://projectstem.org/users/sign_in' },

            // ---- INFRASTRUCTURE ----
            { id: 'aws', name: 'AWS', tier: 'infra', kind: 'snapshot', shape: 'severity',
              file: 'aws.json',
              pageUrl: 'https://health.aws.amazon.com/health/status' },
            { id: 'cloudflare', name: 'Cloudflare', tier: 'infra', kind: 'statuspage',
              url: 'https://www.cloudflarestatus.com/api/v2/status.json',
              pageUrl: 'https://www.cloudflarestatus.com/' },
          ];

          // Infra → dependent service map. Used to suppress infra-only alerts
          // unless a dependent is also red. This is the INVERSE of index.html's
          // INFRA_DEPENDENCIES, which reads service → [infra it depends on]:
          //   instructure: ['aws','cloudflare'], noredink: ['aws','cloudflare'],
          //   blackbaud:   ['aws']
          // Keep the two in sync when either changes.
          const INFRA_DEPENDENTS = {
            cloudflare: ['instructure', 'noredink'],
            aws: ['instructure', 'noredink', 'blackbaud'],
          };

          const STATE_PATH = 'state/last-status.json';
          const SEVERITY_RANK = { operational: 0, degraded: 1, partial: 2, major: 3, breakage: 4, unknown: -1 };

          // ---------- Crash guards ----------
          // Node kills the process with exit code 1 on an uncaught exception or an
          // unhandled rejection. A response stream that errors after we have walked
          // away from it (non-200, socket reset mid-body) emits 'error' with no
          // listener and does exactly that — which is how this job went red with a
          // bare "Process completed with exit code 1" and no explanation.
          //
          // Two rules: (a) always print what actually happened, and (b) a stray
          // network error AFTER the alerting work is done is not a failure — the
          // alert already went out (or there was nothing to send), so warn and exit
          // clean rather than reporting a false red.
          let workComplete = false;
          function handleStray(kind, err) {
            const detail = (err && err.stack) || String(err);
            if (workComplete) {
              console.log(`::warning::Ignoring late ${kind} after alerting finished: ${detail}`);
              return;
            }
            console.error(`::error::${kind}: ${detail}`);
            process.exit(1);
          }
          process.on('uncaughtException', (e) => handleStray('uncaughtException', e));
          process.on('unhandledRejection', (e) => handleStray('unhandledRejection', e));

          // ---------- HTTP helper ----------
          // Every response gets an 'error' listener, non-200 bodies are drained
          // instead of abandoned, and every request has a hard timeout so a hung
          // vendor endpoint can't stall the run.
          const HTTP_TIMEOUT_MS = 12000;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: { 'User-Agent': 'rj-edtech-status-alerter' },
                timeout: HTTP_TIMEOUT_MS,
              }, (res) => {
                res.on('error', (e) => reject(new Error(`stream error for ${url}: ${e.message}`)));

                if (res.statusCode !== 200) {
                  res.resume();  // drain, so the socket closes cleanly instead of erroring later
                  reject(new Error(`HTTP ${res.statusCode} for ${url}`));
                  return;
                }

                let body = '';
                res.setEncoding('utf8');
                res.on('data', (c) => body += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(body)); }
                  catch (e) { reject(new Error(`JSON parse failed for ${url}: ${e.message}`)); }
                });
              });
              req.on('timeout', () => req.destroy(new Error(`timed out after ${HTTP_TIMEOUT_MS}ms: ${url}`)));
              req.on('error', reject);
            });
          }

          function postJson(url, payload) {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify(payload);
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                port: u.port || 443,
                path: u.pathname + u.search,
                method: 'POST',
                timeout: HTTP_TIMEOUT_MS,
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(data),
                },
              }, (res) => {
                res.on('error', (e) => reject(new Error(`Teams webhook stream error: ${e.message}`)));
                let body = '';
                res.setEncoding('utf8');
                res.on('data', (c) => body += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(body);
                  else reject(new Error(`Teams webhook returned HTTP ${res.statusCode}: ${body}`));
                });
              });
              req.on('timeout', () => req.destroy(new Error(`Teams webhook timed out after ${HTTP_TIMEOUT_MS}ms`)));
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }

          // ---------- Severity derivation per vendor kind ----------
          // Atlassian Statuspage indicator: none | minor | major | critical | maintenance
          // Mirrors mapStatuspageIndicator() in index.html.
          function statuspageSeverity(data) {
            const ind = data?.status?.indicator;
            switch (ind) {
              case 'none':        return 'operational';
              case 'minor':       return 'degraded';
              case 'major':       return 'partial';
              case 'critical':    return 'major';
              case 'maintenance': return 'degraded';
              default:            return 'unknown';
            }
          }

          // Instatus summary endpoint. Mirrors fetchInstatus() in index.html:
          // active incidents win, then active maintenances, then page.status.
          function instatusSeverity(data) {
            const pageStatus = data?.page?.status;
            const known = ['UP', 'HASISSUES', 'UNDERMAINTENANCE'];
            if (!pageStatus || !known.includes(pageStatus)) return 'breakage';

            const incidents = Array.isArray(data.activeIncidents) ? data.activeIncidents : [];
            const maint = Array.isArray(data.activeMaintenances) ? data.activeMaintenances : [];

            if (incidents.length > 0) {
              const rank = { MAJOROUTAGE: 3, PARTIALOUTAGE: 2, MINOROUTAGE: 1 };
              const worst = [...incidents].sort((a, b) => (rank[b.impact] || 0) - (rank[a.impact] || 0))[0];
              const map = { MAJOROUTAGE: 'major', PARTIALOUTAGE: 'partial', MINOROUTAGE: 'degraded' };
              return map[worst.impact] || 'degraded';
            }
            if (maint.length > 0) return 'degraded';
            if (pageStatus === 'HASISSUES') return 'partial';
            if (pageStatus === 'UNDERMAINTENANCE') return 'degraded';
            return 'operational';
          }

          // Snapshot files written by the scraper workflows. Field layout varies
          // by scraper — see the `shape` note on VENDORS above.
          function snapshotSeverity(data, shape) {
            if (data?.parseError) return 'breakage';

            if (shape === 'status') {
              // explorelearning.json / soundtrap.json expose one bit of state.
              // Anything other than 'operational' is surfaced as 'partial',
              // matching how index.html renders these two tiles.
              const status = (data?.status || '').trim();
              if (!status) return 'unknown';
              return status === 'operational' ? 'operational' : 'partial';
            }

            if (shape === 'noredink') {
              // noredink.json can carry 'maintenance' or 'check_page' — index.html
              // folds those into degraded / partial respectively.
              const raw = data?.severity;
              if (!raw) return 'unknown';
              if (raw === 'maintenance') return 'degraded';
              if (raw === 'check_page') return 'partial';
              return raw;
            }

            return data?.severity || 'unknown';
          }

          // ---------- Fetch one vendor ----------
          async function getCurrentSeverity(vendor) {
            try {
              if (vendor.kind === 'statuspage') {
                return statuspageSeverity(await fetchJson(vendor.url));
              }
              if (vendor.kind === 'instatus') {
                return instatusSeverity(await fetchJson(vendor.url));
              }
              if (vendor.kind === 'snapshot') {
                if (!fs.existsSync(vendor.file)) {
                  console.log(`[${vendor.id}] snapshot file missing: ${vendor.file}`);
                  return 'unknown';
                }
                const data = JSON.parse(fs.readFileSync(vendor.file, 'utf8'));
                return snapshotSeverity(data, vendor.shape);
              }
              return 'unknown';
            } catch (e) {
              console.log(`[${vendor.id}] fetch failed: ${e.message}`);
              return 'breakage';
            }
          }

          // ---------- Main ----------
          (async () => {
            const webhook = process.env.TEAMS_WEBHOOK_URL;
            if (!webhook) {
              console.log('TEAMS_WEBHOOK_URL not set — exiting without checking.');
              process.exit(0);
            }

            // Load prior state (or null if first run)
            let lastState = null;
            if (fs.existsSync(STATE_PATH)) {
              try { lastState = JSON.parse(fs.readFileSync(STATE_PATH, 'utf8')); }
              catch (e) { console.log('Could not parse last-status.json, treating as first run.'); }
            }
            const isFirstRun = !lastState || !lastState.vendors;

            // Fetch all current statuses in parallel
            const results = await Promise.all(
              VENDORS.map(async (v) => ({ vendor: v, severity: await getCurrentSeverity(v) }))
            );

            // One line per vendor, so the log always shows what was read even when
            // nothing changed — the previous version printed nothing on a quiet run.
            console.log(results.map((r) => `  ${r.vendor.id}: ${r.severity}`).join('\n'));

            // Build current state
            const currentState = {
              checkedAt: new Date().toISOString(),
              vendors: {},
            };
            for (const { vendor, severity } of results) {
              currentState.vendors[vendor.id] = severity;
            }

            // Detect changes (skip on first run)
            const changes = [];
            if (!isFirstRun) {
              for (const { vendor, severity } of results) {
                const previous = lastState.vendors[vendor.id];
                if (previous === undefined) continue;  // new vendor — skip
                if (previous === severity) continue;
                if (severity === 'unknown') continue;  // don't alert on transient unknowns

                changes.push({ vendor, from: previous, to: severity });
              }
            }

            // Filter: infra-only changes suppressed unless a dependent is also red
            const isRed = (sev) => ['degraded', 'partial', 'major', 'breakage'].includes(sev);
            const filteredChanges = changes.filter((c) => {
              if (c.vendor.tier !== 'infra') return true;
              const dependents = INFRA_DEPENDENTS[c.vendor.id] || [];
              const anyDependentRed = dependents.some((depId) => isRed(currentState.vendors[depId]));
              if (!anyDependentRed) {
                console.log(`Suppressing infra-only change: ${c.vendor.name} (no dependents red)`);
                return false;
              }
              return true;
            });

            // Always write state — even if no alert went out, we want next run's diff to be accurate
            fs.mkdirSync('state', { recursive: true });
            fs.writeFileSync(STATE_PATH, JSON.stringify(currentState, null, 2) + '\n');

            if (isFirstRun) {
              console.log(`First run — wrote baseline for ${VENDORS.length} vendors. No alerts sent.`);
              workComplete = true;
              process.exit(0);
            }

            if (filteredChanges.length === 0) {
              console.log('No actionable status changes.');
              workComplete = true;
              process.exit(0);
            }

            // Build Teams message
            const tierOrder = { critical: 0, core: 1, secondary: 2, infra: 3 };
            filteredChanges.sort((a, b) => tierOrder[a.vendor.tier] - tierOrder[b.vendor.tier]);

            const sevLabel = {
              operational: 'Operational',
              degraded: 'Degraded',
              partial: 'Partial outage',
              major: 'Major outage',
              breakage: 'Status check broken',
            };
            const sevEmoji = {
              operational: '✅',
              degraded: '🟡',
              partial: '🟠',
              major: '🔴',
              breakage: '🔧',
            };

            const lines = filteredChanges.map((c) => {
              const worsened = (SEVERITY_RANK[c.to] ?? 0) > (SEVERITY_RANK[c.from] ?? 0);
              const arrow = worsened ? '↗' : '↩';
              const label = c.vendor.pageUrl
                ? `[${c.vendor.name}](${c.vendor.pageUrl})`
                : c.vendor.name;
              return `${sevEmoji[c.to] || '•'} **${label}** ${arrow} ${sevLabel[c.to] || c.to} _(was ${sevLabel[c.from] || c.from})_`;
            });

            const headline = filteredChanges.length === 1
              ? `${filteredChanges[0].vendor.name}: ${sevLabel[filteredChanges[0].to] || filteredChanges[0].to}`
              : `${filteredChanges.length} status changes`;

            // Denver-local timestamp — the ISO string is unreadable at a glance
            // for the people this lands in front of.
            let checkedLocal;
            try {
              checkedLocal = new Date(currentState.checkedAt).toLocaleString('en-US', {
                timeZone: 'America/Denver',
                dateStyle: 'medium',
                timeStyle: 'short',
              }) + ' MT';
            } catch (e) {
              checkedLocal = currentState.checkedAt;
            }

            const payload = {
              type: 'message',
              attachments: [{
                contentType: 'application/vnd.microsoft.card.adaptive',
                content: {
                  type: 'AdaptiveCard',
                  $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                  version: '1.4',
                  body: [
                    { type: 'TextBlock', size: 'Medium', weight: 'Bolder', text: headline },
                    { type: 'TextBlock', text: lines.join('\n\n'), wrap: true },
                    {
                      type: 'TextBlock', isSubtle: true, size: 'Small', spacing: 'Medium', wrap: true,
                      text: `Checked ${checkedLocal} · [Open dashboard](https://rjedtech.github.io/EdTech-Status/)`,
                    },
                  ],
                },
              }],
            };

            await postJson(webhook, payload);
            console.log(`Posted ${filteredChanges.length} change(s) to Teams.`);
            workComplete = true;
          })().catch((e) => {
            console.error(`::error::Alerter failed: ${(e && e.stack) || e}`);
            process.exit(1);
          });
          EOF

      - name: Commit state if changed
        run: |
          set -euo pipefail

          if [ ! -f state/last-status.json ]; then
            echo "No state file written — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The scrapers commit to main every 5 minutes, so a bare push loses the
          # race often. Stash our freshly-computed state file outside the repo,
          # and on rejection reset hard to the remote tip, drop the file back in,
          # and try again. Last-write-wins is correct here: this file is fully
          # regenerated each run, so there is nothing in the remote copy to merge.
          cp state/last-status.json "${RUNNER_TEMP}/last-status.json"

          for attempt in 1 2 3 4 5; do
            mkdir -p state
            cp "${RUNNER_TEMP}/last-status.json" state/last-status.json
            git add state/last-status.json

            if git diff --staged --quiet; then
              echo "No state changes to commit."
              exit 0
            fi

            git commit -m "Update last-status.json [skip ci]"

            if git push; then
              echo "Pushed state on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt} — syncing to remote and retrying."
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD

            # Randomized backoff so concurrent scraper jobs don't collide again
            # on the same retry beat.
            sleep $(( (RANDOM % 6) + attempt * 2 ))
          done

          echo "::error::Could not push state after 5 attempts."
          exit 1
